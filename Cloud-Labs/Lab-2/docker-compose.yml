services:
  redis1:
    image: redis:7
    container_name: redis1
    ports:
      - "6379:6379"

  redis2:
    image: redis:7
    container_name: redis2
    ports:
      - "6380:6379"

  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd
    ports:
      - "2379:2379"
    command: >
      /usr/local/bin/etcd
      --advertise-client-urls=http://0.0.0.0:2379
      --listen-client-urls=http://0.0.0.0:2379